name: Build macOS + Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3 + AU + Standalone
        run: cmake --build build --config Release --parallel 4 --target OVERHEAT_VST3 OVERHEAT_AU OVERHEAT_Standalone

      - name: Ad-hoc sign
        run: |
          ART=build/OVERHEAT_artefacts/Release
          ls -R "$ART" | head -50
          codesign --force --deep --sign - "$ART/VST3/OVERHEAT.vst3"
          codesign --force --deep --sign - "$ART/AU/OVERHEAT.component"
          codesign --force --deep --sign - "$ART/Standalone/OVERHEAT.app"
          lipo -info "$ART/VST3/OVERHEAT.vst3/Contents/MacOS/OVERHEAT"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --output-dir pluginval-logs "build/OVERHEAT_artefacts/Release/VST3/OVERHEAT.vst3"

      - name: Package
        run: |
          ART=build/OVERHEAT_artefacts/Release
          mkdir -p dist/OVERHEAT-mac
          cp -R "$ART/VST3/OVERHEAT.vst3" "$ART/AU/OVERHEAT.component" "$ART/Standalone/OVERHEAT.app" dist/OVERHEAT-mac/
          cp INSTALL-MAC.txt dist/OVERHEAT-mac/
          cd dist && ditto -c -k --sequesterRsrc --keepParent OVERHEAT-mac OVERHEAT-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OVERHEAT-mac
          path: dist/OVERHEAT-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get WebView2 SDK (NuGet)
        shell: pwsh
        run: |
          $v = "1.0.1901.177"
          New-Item -ItemType Directory -Force -Path nuget | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath "nuget/Microsoft.Web.WebView2.$v"

      - name: Configure
        run: cmake -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/nuget"

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --parallel --target OVERHEAT_VST3 OVERHEAT_Standalone

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          $vst = "build/OVERHEAT_artefacts/Release/VST3/OVERHEAT.vst3"
          $p = Start-Process -FilePath "pv/pluginval.exe" -ArgumentList "--strictness-level 5 --skip-gui-tests --validate-in-process --output-dir pv-logs `"$vst`"" -Wait -PassThru -NoNewWindow
          Get-ChildItem pv-logs -Recurse -File | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 15 }
          if ($p.ExitCode -ne 0) { Write-Error "pluginval failed ($($p.ExitCode))"; exit 1 }

      - name: GUI check (editor opens in WebView2)
        shell: pwsh
        continue-on-error: true
        run: |
          $vst = "build/OVERHEAT_artefacts/Release/VST3/OVERHEAT.vst3"
          $p = Start-Process -FilePath "pv/pluginval.exe" -ArgumentList "--strictness-level 3 --validate-in-process --output-dir pv-gui-logs `"$vst`"" -Wait -PassThru -NoNewWindow
          Get-ChildItem pv-gui-logs -Recurse -File | ForEach-Object { Get-Content $_.FullName | Select-String -Pattern "Editor|SUCCESS|FAIL" }
          "GUI pluginval exit code: $($p.ExitCode)"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/OVERHEAT-windows | Out-Null
          Copy-Item -Recurse build/OVERHEAT_artefacts/Release/VST3/OVERHEAT.vst3 dist/OVERHEAT-windows/
          Copy-Item build/OVERHEAT_artefacts/Release/Standalone/OVERHEAT.exe dist/OVERHEAT-windows/
          Copy-Item INSTALL-WINDOWS.txt dist/OVERHEAT-windows/
          Compress-Archive -Path dist/OVERHEAT-windows -DestinationPath dist/OVERHEAT-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OVERHEAT-windows
          path: dist/OVERHEAT-windows.zip

  release:
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dl/OVERHEAT-mac/OVERHEAT-mac.zip dl/OVERHEAT-windows/OVERHEAT-windows.zip \
            --title "OVERHEAT — latest build (macOS + Windows)" \
            --notes "macOS: universal (Apple Silicon + Intel) VST3, AU, Standalone. Windows: 64-bit VST3 + Standalone. Install steps are inside each zip." \
            --target "${{ github.sha }}"
